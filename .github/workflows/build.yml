name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: be049399bf9136dc1dab93d5844db9730512a549

      - uses: actions/upload-artifact@v4
        with:
          name: Mod Windows
          path: ${{ steps.build.outputs.build-output }}

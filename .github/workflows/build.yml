name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: 36e102f0f84d89f92ed9b0bc2fbc5b5934a886d6

      - uses: actions/upload-artifact@v4
        with:
          name: Mod Windows
          path: ${{ steps.build.outputs.build-output }}
